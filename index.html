<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harper Austin's personal website." />
    <meta name="theme-color" content="#ffffff" />
    <title>Harper Austin</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="modern.css?v=33" />
    <link rel="stylesheet" href="redesign.css?v=6" />
  </head>
  <body>
    <main class="minimal-shell">
      <section class="minimal-home site-view is-active" id="terminalView">
        <h1>Harper Austin</h1>
        <nav class="minimal-links" aria-label="Harper Austin links">
          <a class="minimal-link" href="#about">about</a>
          <button class="minimal-link terminal-tab" type="button" data-view="blog">blog</button>
          <a class="minimal-link" href="https://www.linkedin.com/in/harper-austin-523743276/">linkedin</a>
          <a class="minimal-link" href="https://github.com/harperaustin">github</a>
          <a class="minimal-link" href="#music">music</a>
          <a class="minimal-link" href="#photography">photography</a>
        </nav>
        <section class="minimal-about" id="aboutPanel" aria-hidden="true">
          <div>
            <p>
              from keller, tx and currently a senior at brown university studying computer science.
              interested in ai, music, traveling.
            </p>
          </div>
        </section>
      </section>

      <section class="blog-view site-view" id="blogView" aria-labelledby="blogHeading" hidden>
        <header class="blog-header">
          <div>
            <button class="blog-home-link terminal-tab" type="button" data-view="terminal">
              ← back
            </button>
            <h1 id="blogHeading">Blog</h1>
          </div>
          <div class="blog-actions">
            <span class="blog-author-status" id="blogAuthorStatus" hidden>Author mode</span>
            <button class="blog-action-button" id="logoutButton" type="button" hidden>Log out</button>
            <button class="blog-add-button" id="newPostButton" type="button" aria-label="Write a new post" hidden>+</button>
          </div>
        </header>
        <div class="blog-message" id="blogMessage" role="status">Loading posts…</div>
        <div class="blog-posts" id="blogPosts"></div>
        <article class="blog-detail" id="blogDetail" hidden>
          <div class="blog-detail-toolbar">
            <button class="blog-back-button" id="blogBackButton" type="button">← All posts</button>
            <div class="blog-detail-controls">
              <button class="blog-action-button" id="copyPostLinkButton" type="button">Copy link</button>
              <div class="blog-detail-actions" id="blogDetailActions" hidden>
                <button class="blog-action-button" id="editPostButton" type="button">Edit</button>
                <button class="blog-action-button blog-delete-button" id="deletePostButton" type="button">Delete</button>
              </div>
            </div>
          </div>
          <time id="blogDetailDate"></time>
          <h1 id="blogDetailTitle"></h1>
          <div class="blog-detail-content" id="blogDetailContent"></div>
        </article>
        <button
          class="author-login-hotspot"
          id="authorLoginHotspot"
          type="button"
          aria-label="Author login"
        ></button>
      </section>
    </main>

    <dialog id="authorDialog" aria-labelledby="authorDialogTitle">
      <form class="blog-dialog-form" id="authorForm">
        <div class="dialog-header">
          <h2 id="authorDialogTitle">Author login</h2>
          <button type="button" data-close-dialog="authorDialog">Close</button>
        </div>
        <div class="blog-form-fields">
          <label>
            Email
            <input id="authorEmail" type="email" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="authorPassword" type="password" autocomplete="current-password" required />
          </label>
          <p class="blog-form-error" id="authorError" role="alert"></p>
          <button class="blog-primary-button" type="submit">Log in</button>
        </div>
      </form>
    </dialog>

    <dialog id="postDialog" aria-labelledby="postDialogTitle">
      <form class="blog-dialog-form" id="postForm">
        <div class="dialog-header">
          <h2 id="postDialogTitle">New post</h2>
          <button class="dialog-close-button" type="button" data-close-dialog="postDialog" aria-label="Close editor">×</button>
        </div>
        <div class="blog-form-fields">
          <input id="postId" type="hidden" />
          <label>
            Title
            <input id="postTitle" type="text" maxlength="160" required />
          </label>
          <label>
            Body
            <span class="blog-format-help">Use the buttons to insert headings, code blocks, tables, and expandable sections.</span>
            <span class="blog-format-toolbar" aria-label="Post formatting">
              <button type="button" data-format="heading">Section heading</button>
              <button type="button" data-format="subheading">Subheading</button>
              <button type="button" data-format="code-js">JavaScript</button>
              <button type="button" data-format="code-python">Python</button>
              <button type="button" data-format="table">Table</button>
              <button type="button" data-format="link">Link</button>
              <button type="button" data-format="expandable">Expandable</button>
            </span>
            <textarea id="postContent" rows="12" required></textarea>
          </label>
          <p class="blog-form-error" id="postError" role="alert"></p>
          <div class="blog-save-actions">
            <button class="blog-secondary-button" id="saveDraftButton" type="submit" value="draft">Save as draft</button>
            <button class="blog-primary-button" id="savePostButton" type="submit" value="publish">Publish post</button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="site-config.js?v=1"></script>
    <script src="blog.js?v=7"></script>
    <script src="redesign.js?v=6"></script>
  </body>
</html>
