<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harper Austin's personal website." />
    <meta name="theme-color" content="#d9dce3" />
    <title>Harper Austin</title>
    <link rel="stylesheet" href="modern.css?v=24" />
  </head>
  <body data-theme="light">
    <section class="modern-stage" id="modernStage">
      <main class="terminal-window">
        <header class="terminal-titlebar">
          <div class="traffic-lights" aria-hidden="true">
            <span class="traffic-light close"></span>
            <span class="traffic-light minimize"></span>
            <span class="traffic-light maximize"></span>
          </div>
          <p class="terminal-title">harper — zsh — 80×24</p>
        </header>

        <div class="terminal-content">
          <div class="terminal-output" id="terminalOutput" aria-live="polite"></div>
          <div class="command-palette" id="commandPalette" role="listbox" aria-label="Available commands" hidden></div>
          <form class="terminal-prompt" id="terminalForm">
            <label class="sr-only" for="terminalInput">Enter a command</label>
            <span aria-hidden="true">❯</span>
            <input
              id="terminalInput"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Type / for commands"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="commandPalette"
              aria-expanded="false"
            />
            <span class="command-hint" aria-hidden="true"><kbd>/</kbd> commands</span>
            <button type="submit" aria-label="Run command">↵</button>
          </form>
        </div>
      </main>
    </section>

    <section class="retro-stage" id="retroStage" aria-label="Retro website" aria-hidden="true" inert>
      <iframe src="retro.html?v=2" title="Harper Austin retro website"></iframe>
    </section>

    <script src="script.js?v=26"></script>
  </body>
</html>
